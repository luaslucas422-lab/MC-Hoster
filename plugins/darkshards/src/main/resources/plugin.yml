name: DarkShards
version: ${project.version}
main: dev.darkerdawnfr.darkshards.DarkShards
api-version: "1.20"
softdepend: [DarkCrates, DarkSpawners]
author: DarkerDawnFR
description: DonutSMP-style shards and the shard shop (24-hour shard tools). Made for MC Hoster.
commands:
  shards:
    description: The shard shop. /shards balance, /shards pay <player> <amount>, /shards edit (ops).
    aliases: [shard, shardshop]
permissions:
  darkshards.admin:
    default: op
