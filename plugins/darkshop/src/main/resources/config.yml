# /bounty: put money on someone's head, the player who kills them gets it.
bounty:
  min: 100

# /orders: buy orders. The money is held when the order is made.
orders:
  max-orders: 5
  max-amount: 100000
  min-price: 0.1

# Show what the item you hold sells for above the hotbar when you switch to it (players can turn it off in /settings).
worth-hint: true

# /shop premium: only for ranks (darkshop.premium). Better deals and things the normal shop doesn't have,
# priced so the economy stays fair. Bigger ranks get a bigger discount (darkshop.discount.<name>).
premium:
  discounts:
    vip: 5
    vipplus: 7.5
    mvp: 10
    mvpplus: 12.5
    legend: 15
  categories:
    gear:
      name: "&6Premium Gear"
      icon: NETHERITE_CHESTPLATE
      slot: 11
      lore: "&7Strong gear for ranks."
      items:
        TOTEM_OF_UNDYING: 1000
        END_CRYSTAL: 400
        GOLDEN_APPLE: 80
        ENCHANTED_GOLDEN_APPLE: 15000
        NETHERITE_SCRAP: 2500
        OBSIDIAN: 80
        EXPERIENCE_BOTTLE: 25
        SHIELD: 300
    rare:
