config-version: 2

# Dark Shop by DarkerDawnFR: the old DonutSMP /shop (End, Nether, Gear, Food), /sell and money.
# Change prices here, then /darkshop reload.

# /pay, /bal, /baltop, /sell, /worth, /eco, /shop and /bounty always use Dark Shop,
# even if EssentialsX or another plugin has the same commands.
own-commands: true

# Money a new player starts with (only used when Dark Shop keeps the balances itself).
start-balance: 0

# Most of one item you can buy at once in the amount menu.
max-buy: 2304

# Categories in /shop. icon and items use Minecraft item names. Items: NAME: price for 1.
# Items that don't exist in your Minecraft version are skipped.
categories:
  end:
    name: "&dEnd"
    icon: END_STONE
    slot: 10
    lore: "&7Blocks and items from the End."
    items:
      END_STONE: 10
      ENDER_PEARL: 50
      ENDER_CHEST: 2500
      CHORUS_FRUIT: 15
      DRAGON_BREATH: 300
      PURPUR_BLOCK: 20
      END_ROD: 50
      SHULKER_SHELL: 7500
  nether:
    name: "&cNether"
    icon: NETHERRACK
    slot: 12
    lore: "&7Blocks and items from the Nether."
    items:
      NETHERRACK: 2
      SOUL_SAND: 10
      NETHER_WART: 20
      GLOWSTONE_DUST: 15
      QUARTZ: 20
      MAGMA_CREAM: 50
      BLAZE_ROD: 150
      GHAST_TEAR: 300
  gear:
    name: "&bGear"
    icon: TOTEM_OF_UNDYING
    slot: 14
    lore: "&7Everything you need to fight."
    items:
      OBSIDIAN: 100
      END_CRYSTAL: 500
      RESPAWN_ANCHOR: 1000
      GLOWSTONE: 100
      TOTEM_OF_UNDYING: 1250
      GOLDEN_APPLE: 100
      EXPERIENCE_BOTTLE: 30
      ARROW: 5
  food:
    name: "&aFood"
    icon: COOKED_BEEF
    slot: 16
    lore: "&7Food to keep you going."
    items:
      POTATO: 5
      CARROT: 5
      SWEET_BERRIES: 5
      APPLE: 10
      BREAD: 10
      COOKED_CHICKEN: 20
      COOKED_BEEF: 35
