# Dark Rifts by DarkerDawnFR.
# Every so often a purple rift opens somewhere in the world. Stand in it to charge it - but it only charges
# while ONE player is inside, so you have to fight for it. Mobs come in waves. At 100% whoever held it the
# longest gets the rewards, and everyone who helped gets a few shards.

# Open rifts by themselves (ops can always use /rift start).
automatic: true
every-minutes: 45
# Don't open one unless at least this many players are online.
min-players: 2
# How long a rift stays before it collapses.
open-minutes: 10
# Seconds one player needs to hold it to reach 100%.
charge-seconds: 90
# Two or more players inside stops the charging until only one is left.
contested-pauses: true
# How wide the rift is (blocks from the middle).
size: 6
# Where they open: world name ("" = the main world), and how far from the middle of the world border.
world: ""
radius: 3000
min-radius: 300

waves:
  every-seconds: 20
  # First wave size; each wave adds one more, up to max.
  mobs: 3
  max: 12
  alive-limit: 25
  types: [ZOMBIE, SKELETON, SPIDER, HUSK, STRAY]
  name: "&5Rift Walker"

rewards:
  # Money needs Dark Shop, shards need Dark Shards.
  money: 25000
  shards: 25
  items: ["DIAMOND:5", "NETHERITE_SCRAP:2", "GOLDEN_APPLE:4", "EXPERIENCE_BOTTLE:32", "ENDER_PEARL:8"]
  helper-shards: 5
  helper-min-seconds: 10

prefix: "&8[&5✦ Rift&8] "
scoreboard-none: "none"
