# Dark AH by DarkerDawnFR: a DonutSMP-style auction house.
# Money comes from Dark Shop, or from Vault and any economy plugin (EssentialsX, CMI...).

# How long an item stays up before it goes back to the seller (they collect it in /ah > Your items).
listing-hours: 48
# How many items one player can sell at once (ops have no limit).
max-listings: 10
min-price: 1
max-price: 1000000000000
# Percent of each sale the seller doesn't get (0 = they get everything).
tax-percent: 0
# Tell everyone when something is listed.
broadcast-listings: false
# Items that can't be sold, e.g. BEDROCK
blocked-items: []

messages:
  prefix: "&8[&dAH&8] "
  bought: "&aYou bought &f{item} &afor &f{price}&a."
  sold: "&a{buyer} bought your &f{item} &afor &f{price}&a."
  sold-away: "&aWhile you were away you sold &f{count} &aitem(s) on /ah for &f{price}&a."
  not-enough: "&cYou don't have enough money. You need &f{price}&c."
  gone: "&cSomeone already bought that, or it expired."
  own: "&cThat's your own item."
  removed: "&7You took back &f{item}&7."
  expired: "&7Your &f{item} &7didn't sell. Collect it in /ah > Your items."
  collect: "&aYou have &f{count} &aitem(s) to collect in /ah > Your items."
  inventory-full: "&7Your inventory is full, so it's waiting in /ah > Your items."
  no-economy: "&cThe auction house has no money system. Ask an admin to add Dark Shop."
  search-ask: "&7Type what you're looking for in chat (or &fcancel&7)."
