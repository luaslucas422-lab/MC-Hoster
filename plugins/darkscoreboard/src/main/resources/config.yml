# Dark Scoreboard by DarkerDawnFR: the old DonutSMP scoreboard and the tab list.
# Easiest way to change it: /dsb edit in game (ops). Or edit this file and /dsb reload.
#
# & colours work (&a green, &l bold...). Placeholders: {player} {money} {kills} {deaths} {kdr} {playtime}
# {bounty} {baltop} {ping} {online} {max} {world} {x} {y} {z} {health} {level} {listings} {ah_total}
# {rtp_queue} {discord} {shards} {combat} {homes} {rift} {keyall} {rank} {rankname} {date} {time} {mobkills} {displayname} {money_raw}
# PlaceholderAPI %placeholders% work too if it's installed.

# How often it refreshes (20 = every second).
update-ticks: 20

scoreboard:
  enabled: true
  # Hide the red numbers on the right (Paper, Purpur, Pufferfish; Spigot always shows them).
  hide-numbers: true
  # Hide lines for plugins that aren't installed (e.g. Shards without Dark Shards).
  hide-missing: true
  title: "&b&lTest SMP"
  # Up to 15 lines, top to bottom. "" is an empty line.
  lines:
    - ""
    - "&6♛ &fRank {rankname}"
    - "&a$ &fMoney &a{money}"
    - "&c⚔ &fKills &c{kills}"
    - "&6☠ &fDeaths &6{deaths}"
    - "&5✦ &fShards &5{shards}"
    - "&d⚑ &fBounty &d{bounty}"
    - "&e⌛ &fPlaytime &e{playtime}"
    - "&b✪ &fKey All &b{keyall}"
    - ""
    - "&7{online} online &8| &7{ping}ms"
    - "&b&oTest SMP"

tab:
  enabled: true
  header: "\n&b&lTest SMP\n&7Welcome, &f{player}&7!\n"
  footer: "\n&a$ {money} &8| &c⚔ {kills} &8| &6☠ {deaths}\n&7{online}/{max} online &8| &7{ping}ms\n"
  # How names look in the tab list. Empty = normal names.
  name-format: "{rank}&f{player} &7{ping}ms"
