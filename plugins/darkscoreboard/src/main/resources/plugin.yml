name: DarkScoreboard
version: ${project.version}
main: dev.darkerdawnfr.darkscoreboard.DarkScoreboard
api-version: "1.20"
author: DarkerDawnFR
description: The old DonutSMP scoreboard and tab list, connected to the other Dark plugins. Made for MC Hoster.
softdepend: [DarkShop, DarkAH, DarkRTP, DarkDiscord, DarkShards, DarkCombat, DarkHomes, DarkRifts, DarkCrates, Vault, VaultUnlocked, PlaceholderAPI]
commands:
  dsb:
    description: Edit the scoreboard (/dsb edit) or hide yours (/dsb toggle).
    aliases: [darkscoreboard, sbedit]
permissions:
  darkscoreboard.edit:
    default: op
