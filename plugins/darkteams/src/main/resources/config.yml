# Dark Teams by DarkerDawnFR: DonutSMP-style teams.
# /team (menu), /team create <name>, /team invite <player>, /team join <team>, /team leave,
# /team home, /team sethome, /team chat or /tc <message>, /team kick, /team transfer, /team pvp, /team disband

# Most players in one team (owner included).
max-members: 10
# Team names: letters, numbers and _ only.
name-min: 3
name-max: 16
blocked-names: [admin, owner, staff]
# Can team mates hurt each other when a team is made? The owner can switch it: /team pvp
friendly-fire-default: false
# Can members (not just the owner) invite players / set the team home?
members-can-invite: true
members-can-sethome: false
# Seconds of standing still before /team home teleports you.
countdown-seconds: 5

# Team chat. Start a message with ! to talk to everyone while team chat is on.
chat-format: "&9[Team] &f{player}&8: &b{message}"
log-team-chat: true

prefix: "&8[&9Team&8] "
