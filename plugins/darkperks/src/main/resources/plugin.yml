name: DarkPerks
version: ${project.version}
main: dev.darkerdawnfr.darkperks.DarkPerks
api-version: "1.20"
author: DarkerDawnFR
description: Commands only rank holders get - /fly, /ec, /craft, /hat, /feed, /heal, /repair, /nick, /glow, /trail. Made for MC Hoster.
softdepend: [DarkRanks, DarkCombat]
commands:
  perks:
    description: Which rank perks you have.
  craft:
    description: A crafting table anywhere (rank perk).
    aliases: [workbench, wb]
  hat:
    description: Wear the item you hold (rank perk).
  ec:
    description: Your ender chest anywhere (rank perk).
    aliases: [enderchest]
  feed:
    description: Fill your hunger (rank perk).
  fly:
    description: Fly (not in combat) (rank perk).
  nick:
    description: A coloured nickname (rank perk).
    aliases: [nickname]
  repair:
    description: Fix the item you hold (rank perk).
    aliases: [fix]
  glow:
    description: Glow for everyone (rank perk).
  heal:
    description: Full health (rank perk).
  trail:
    description: Particle trails (rank perk).
    aliases: [trails]
permissions:
  darkperks.admin:
    default: op
  darkperks.*:
    description: Every perk.
    default: op
    children:
      darkperks.craft: true
      darkperks.hat: true
      darkperks.ec: true
      darkperks.feed: true
      darkperks.fly: true
      darkperks.nick: true
      darkperks.repair: true
      darkperks.glow: true
      darkperks.heal: true
      darkperks.trail: true
  darkperks.craft:
    description: A crafting table anywhere
    default: op
  darkperks.hat:
    description: Wear the item you hold
    default: op
  darkperks.ec:
    description: Your ender chest anywhere
    default: op
  darkperks.feed:
    description: Fill your hunger
    default: op
  darkperks.fly:
    description: Fly (not in combat)
    default: op
  darkperks.nick:
    description: A coloured nickname
    default: op
  darkperks.repair:
    description: Fix the item you hold
    default: op
  darkperks.glow:
    description: Glow for everyone
    default: op
  darkperks.heal:
    description: Full health
    default: op
  darkperks.trail:
    description: Particle trails
    default: op
