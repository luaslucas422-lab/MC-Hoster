name: DarkSpawners
version: ${project.version}
main: dev.darkerdawnfr.darkspawners.DarkSpawners
api-version: "1.20"
author: DarkerDawnFR
description: DonutSMP-style spawners that fill with loot and XP instead of spawning mobs, and stack. Made for MC Hoster.
softdepend: [DarkShop, DarkShards]
commands:
  spawners:
    description: The spawners you can get. Ops - /spawners give <player> <kind> [amount].
    aliases: [spawner]
permissions:
  darkspawners.admin:
    default: op
