# Dark Spawners by DarkerDawnFR, like DonutSMP's.
# Placed spawners don't spawn mobs: every `seconds-per-drop` each spawner in the stack adds the loot below.
# Right-click to open (collect, sell all with Dark Shop prices, take XP). Right-click with another to stack.
# Buy them in /shards (Spawners page) for shard-price shards. Loot: "ITEM:min-max".

seconds-per-drop: 60
# Most items one spawner can hold (x the stack).
storage-per-spawner: 1728
xp-per-spawner: 5000

types:
  pig:
    name: "&d&lPig Spawner"
    shard-price: 50
    xp: 2
    loot: ["PORKCHOP:1-3"]
  cow:
    name: "&6&lCow Spawner"
    shard-price: 60
    xp: 2
    loot: ["BEEF:1-3", "LEATHER:0-2"]
  chicken:
    name: "&f&lChicken Spawner"
    shard-price: 50
    xp: 2
    loot: ["CHICKEN:1-2", "FEATHER:0-2"]
  sheep:
    name: "&f&lSheep Spawner"
    shard-price: 50
    xp: 2
    loot: ["MUTTON:1-2", "WHITE_WOOL:1-2"]
  zombie:
    name: "&2&lZombie Spawner"
    shard-price: 75
    xp: 5
    loot: ["ROTTEN_FLESH:1-3"]
  skeleton:
    name: "&7&lSkeleton Spawner"
    shard-price: 100
    xp: 5
    loot: ["BONE:1-3", "ARROW:1-3"]
  spider:
    name: "&8&lSpider Spawner"
    shard-price: 75
    xp: 5
    loot: ["STRING:1-3", "SPIDER_EYE:0-1"]
  creeper:
    name: "&a&lCreeper Spawner"
    shard-price: 125
    xp: 5
    loot: ["GUNPOWDER:1-3"]
  blaze:
    name: "&6&lBlaze Spawner"
    shard-price: 200
    xp: 10
    loot: ["BLAZE_ROD:1-2"]
  iron_golem:
    name: "&f&lIron Golem Spawner"
    shard-price: 300
    xp: 5
    loot: ["IRON_INGOT:1-3", "POPPY:0-1"]
  zombified_piglin:
    name: "&c&lZombified Piglin Spawner"
    shard-price: 250
    xp: 5
    loot: ["GOLD_NUGGET:2-5", "ROTTEN_FLESH:0-1"]

prefix: "&8[&eSpawners&8] "
