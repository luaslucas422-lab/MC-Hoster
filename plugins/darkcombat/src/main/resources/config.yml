# Dark Combat by DarkerDawnFR: the DonutSMP combat tag.

# How long combat lasts after a hit. Change it in game: /combat time <seconds>
seconds: 20
# Logging out in combat kills you (your items drop).
kill-on-logout: true
# Stop /fly when you get hit, and (if true) stop elytra flying in combat.
stop-flying: true
stop-elytra: false
# Ender pearl cooldown while in combat, in seconds (0 = normal 1 second).
pearl-cooldown-seconds: 15
# Worlds with no combat tag, e.g. [hub]
disabled-worlds: []
# Commands you can't use in combat (teleports).
blocked-commands: [home, homes, h, sethome, hub, hubs, lobby, rtp, wild, randomtp, rtpq, rtpqueue, tpa, tpahere, tpaccept, tpyes, tp, tphere, spawn, warp, warps, back, ec, enderchest, duel, duels, duals]

prefix: "&8[&4Combat&8] "
messages:
  tagged: "&4⚔ &8You're in combat for &4{time}s&8. Don't log out!"
  bar: "&4⚔ &8Combat &4{time}s &8{bar}"
  ended: "&8You are no longer in combat."
  ended-bar: "&8You are no longer in combat"
  blocked: "&4You can't do that in combat &8({time}s left)&4."
  logged-out: "&4☠ &8{player} logged out in combat and died."
  no-elytra: "&4You can't fly with an elytra in combat."
