name: DarkHub
version: ${project.version}
main: dev.darkerdawnfr.darkhub.DarkHub
api-version: "1.20"
author: DarkerDawnFR
description: /hub menu of beds (one per hub) with a Random Hub button, /hubset. Made for MC Hoster.
softdepend: [DarkCombat]
commands:
  hub:
    description: Open the hub menu, or /hub <number> / /hub random.
    aliases: [hubs, lobby]
  hubset:
    description: Set hub <number> where you stand (/hubset <number> [name]).
    permission: darkhub.admin
  hubdel:
    description: Delete a hub.
    permission: darkhub.admin
  darkhub:
    description: Dark Hub admin (reload, test).
    permission: darkhub.admin
permissions:
  darkhub.admin:
    default: op
  darkhub.bypassfull:
    description: Join a hub even when it's full.
    default: op
