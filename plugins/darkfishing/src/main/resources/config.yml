# Dark Fishing by DarkerDawnFR.
# Fishing gives custom fish (rarity, weight, length and a price: sell them with /sell), money and shard vouchers,
# crate keys (Dark Crates) and fishing books. With a Lava Line book on your rod you can fish in lava, with Void Line
# in the void (cast over the edge of the End, or under any world). Books: rare catches, or /fish give <player> lava|void.

# What a catch is (bigger = more often). normal-loot = the usual Minecraft catch.
chances:
  fish: 72
  money-voucher: 9
  shard-voucher: 7
  crate-key: 4
  book: 2
  normal-loot: 6
# Voucher amounts (lava and void ones are worth more).
vouchers:
  money-min: 500
  money-max: 5000
  shards-min: 2
  shards-max: 15
# All fish prices x this.
fish-price-multiplier: 1.0
prefix: "&8[&bFishing&8] "
