name: DarkFishing
version: ${project.version}
main: dev.darkerdawnfr.darkfishing.DarkFishing
api-version: "1.20"
author: DarkerDawnFR
description: Custom fish, vouchers, crate keys, and lava and void fishing. Made for MC Hoster.
