name: DarkAFKZone
version: ${project.version}
main: dev.darkerdawnfr.darkafkzone.DarkAFKZone
api-version: "1.20"
author: DarkerDawnFR
description: An AFK zone that gives shards every minute you stand in it. Made for MC Hoster.
softdepend: [DarkShards, DarkCombat]
commands:
  afkzone:
    description: Go to the AFK zone (ops - set 1, set 2, wand, create, setspawn).
    aliases: [afkarea, afkzones]
permissions:
  darkafkzone.admin:
    default: op
