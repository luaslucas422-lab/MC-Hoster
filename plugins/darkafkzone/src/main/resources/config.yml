# Dark AFK Zone by DarkerDawnFR: stand in the AFK zone and get shards (needs Dark Shards).
# Make it: /afkzone set 1 and /afkzone set 2 (looking at the two corner blocks) or /afkzone wand,
# then /afkzone create <name>, and /afkzone setspawn where /afkzone should send players.
# Tip: protect it with Dark Hates Griefers (/dhg) so nobody breaks it.

# Shards for every "every-seconds" in the zone (leaving starts the timer over).
shards: 10
every-seconds: 60
countdown-seconds: 5
action-bar: "&b&lAFK ZONE &8| &7+&d✦ {shards} &7in &f{time}"
prefix: "&8[&bAFK Zone&8] "
