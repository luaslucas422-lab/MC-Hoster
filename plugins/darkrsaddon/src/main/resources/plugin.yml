name: DarkRSAddon
version: ${project.version}
main: dev.darkerdawnfr.darkrsaddon.DarkRSAddon
api-version: "1.20"
author: DarkerDawnFR
description: Turn RoseStacker mob/item stacking on or off for the area around you in /settings; the first player there decides. Needs RoseStacker. Made for MC Hoster.
softdepend: [RoseStacker, DarkSettings]
commands:
  stacking:
    description: Is stacking on in your chunk? (change it in /settings)
    aliases: [rsaddon]
permissions:
  darkrsaddon.admin:
    default: op
