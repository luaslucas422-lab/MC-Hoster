# Dark RS Add-on by DarkerDawnFR, for RoseStacker.
# Each player sets "Stacking" in /settings. It counts for the area around them.
# Where players' areas overlap, the player who got there first decides.

# How far around a player their setting reaches, in chunks (3 = 7x7 chunks, about 112 blocks across).
radius-chunks: 3
# Areas with nobody in them:
empty-chunks-stack: true
# When stacking is off, split mob and item stacks that are already there (a few every check, so it never lags).
split-existing-stacks: true
split-per-check: 60
# Stacks bigger than this are left alone (splitting a 5000 mob farm stack would crash the server).
split-max-stack: 64
check-ticks: 40
# Also stop spawner and block stacking? (off: placed spawners and blocks always stack)
affect-blocks-and-spawners: false
