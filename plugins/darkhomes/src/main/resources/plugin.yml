name: DarkHomes
version: ${project.version}
main: dev.darkerdawnfr.darkhomes.DarkHomes
api-version: "1.20"
author: DarkerDawnFR
description: The modern DonutSMP /home menu. Made for MC Hoster.
softdepend: [DarkCombat]
commands:
  home:
    description: Open your homes, or /home <number> to go there.
    aliases: [homes, h]
  sethome:
    description: Set a home where you stand (/sethome <number>).
  delhome:
    description: Delete a home (/delhome <number>).
  darkhomes:
    description: Dark Homes admin (reload, test).
    permission: darkhomes.admin
permissions:
  darkhomes.admin:
    default: op
