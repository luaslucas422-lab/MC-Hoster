name: NoEnchantLimits
version: ${project.version}
main: dev.darkerdawnfr.noenchantlimits.NoEnchantLimits
api-version: "1.20"
author: DarkerDawnFR
description: /enchant with any enchantment on any item, at any level up to 255. Made for MC Hoster.
commands:
  enchant:
    description: /enchant <enchantment> [level], or /enchant <player> <enchantment> [level]. No limits.
    aliases: [nel, ench]
    permission: noenchantlimits.use
  noenchantlimits:
    description: No Enchant Limits (test).
    permission: noenchantlimits.use
permissions:
  noenchantlimits.use:
    default: op
