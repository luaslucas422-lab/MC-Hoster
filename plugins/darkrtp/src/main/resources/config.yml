# Dark RTP by DarkerDawnFR: /rtp and /rtpqueue (/rtpq).

# Seconds to stand still before /rtp teleports you (ops skip it).
countdown-seconds: 5
# Seconds between two /rtp (ops skip it).
cooldown-seconds: 20

# /rtpqueue: which world, and the countdown once two players are matched.
queue-world: overworld
queue-countdown-seconds: 3

# How far from the middle of the world border players can land (never past the border).
worlds:
  overworld:
    enabled: true
    radius: 5000
    min-radius: 200
  nether:
    enabled: true
    radius: 2500
    min-radius: 100
  end:
    enabled: true
    # The outer End islands start about 1000 blocks out.
    radius: 4000
    min-radius: 1100

prefix: "&8[&dRTP&8] "
