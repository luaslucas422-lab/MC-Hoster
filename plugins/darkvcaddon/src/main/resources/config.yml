# Dark VC Add-on by DarkerDawnFR. Needs Simple Voice Chat on the server (and the mod for players).
# Nobody can talk or listen until they type /voicechat agree and click Continue in the pop-up.

popup:
  title: "&8Voice Chat Rules"
  rules:
    - "No slurs, hate or harassment."
    - "No screaming, loud noises or music."
    - "Don't share personal information."
    - "Respect people who ask you to stop."
    - "Staff can mute you at any time."
  you-need:
    - "The Simple Voice Chat mod (Fabric, Forge or NeoForge)"
    - "A microphone (or just listen)"
    - "Press V in game to open voice chat"
  done: "&aYou have voice chat now! Press &fV &ato open it. Rejoin if you can't hear anyone yet."

remind-on-join: true
reminder: "&7Want voice chat? Type &f/voicechat agree &7and accept the rules."

# Simple Voice Chat's permissions that stay off until you agree.
voicechat-permissions: [voicechat.speak, voicechat.listen, voicechat.groups]

prefix: "&8[&dVoice Chat&8] "
