name: DarkRanks
version: ${project.version}
main: dev.darkerdawnfr.darkranks.DarkRanks
api-version: "1.20"
author: DarkerDawnFR
description: Ranks with permissions, a custom prefix and icon, sold for money in /rank shop. Made for MC Hoster.
softdepend: [DarkShop, DarkAnnounce]
loadbefore: [DarkChat, DarkScoreboard]
commands:
  rank:
    description: /rank shop, /rank info. Ops - /rank add <player> <rank>, /rank remove, /rank edit.
    aliases: [ranks]
  media:
    description: What you need for the Media rank.
permissions:
  darkranks.admin:
    default: op
