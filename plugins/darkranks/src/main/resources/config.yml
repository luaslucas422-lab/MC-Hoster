# Dark Ranks by DarkerDawnFR. Easiest: /rank edit in game (ops).
#
# prefix  = what shows before a player's name in chat and the tab list, with any icon you like (✦ ✪ ♛ ★ ▶ ☠ ⚡ ❤).
# weight  = how good the rank is (higher = better). You can only buy ranks above yours.
# shop    = sold in /rank shop for `price` (Dark Shop money).
# inherit = also gets every permission of that rank.
# permissions = like LuckPerms. The Dark Perks commands (darkperks.*) are only for ranks.

config-version: 5
default-rank: member

# /media: what someone needs to get the Media rank (shown in the item's lore). Change it freely.
media:
  requirements:
    - "&f500+ &7subscribers or followers"
    - "&f1 video &7or stream on this server"
    - "&7Videos must show the server's name / IP"
    - "&7Be active and follow the rules"
  how-to-apply:
    - "&7Post your channel in our Discord (&f/discord&7)"
    - "&7and ask staff for the &d&lMEDIA &7rank."
  perks:
    - "&d&l▶ MEDIA &7tag in chat and tab"
    - "&7Everything LEGEND has"
# Tell everyone when someone buys a rank (with Dark Announce: a thank-you with fireworks).
announce-buys: true
message-prefix: "&8[&6Ranks&8] "

ranks:
  member:
    name: "&7Member"
    prefix: ""
    weight: 0
    shop: false
    icon: PAPER
    permissions: []
    perks: []

  # ---- the 5 ranks in /rank shop
  vip:
    name: "&a&lVIP"
    prefix: "&a&l✦ VIP &r"
    weight: 10
    price: 50000
    shop: true
    icon: EMERALD
    inherit: member
    permissions: [darkperks.craft, darkperks.hat, darkperks.ec, darkhomes.homes.7, darkshop.premium, darkshop.discount.vip, darkshop.multiplier.vip, darkessentials.starter.vip]
    perks: ["&f/shop premium &7- 5% off", "&f/ec &7- ender chest anywhere", "&f/craft &7- crafting table anywhere", "&f/hat &7- wear any block", "&f7 homes", "&fBetter respawn kit (iron sword)", "&f1.05x /sell money"]
  vip+:
    name: "&2&lVIP+"
    prefix: "&2&l✦ VIP+ &r"
    weight: 20
    price: 150000
    shop: true
    icon: EMERALD_BLOCK
    inherit: vip
    permissions: [darkperks.feed, darkhomes.homes.9, darkshop.discount.vipplus, darkshop.multiplier.vipplus, darkessentials.starter.vipplus]
    perks: ["&7Everything in VIP", "&f/shop premium &7- 7.5% off", "&f/feed &7- fill your hunger", "&f9 homes", "&fRespawn kit: iron armour and tools", "&f1.1x /sell money"]
  mvp:
    name: "&b&lMVP"
    prefix: "&b&l✪ MVP &r"
    weight: 30
    price: 400000
    shop: true
    icon: DIAMOND
    inherit: vip+
    permissions: [darkperks.fly, darkperks.nick, darkhomes.homes.12, darkshop.discount.mvp, darkshop.multiplier.mvp, darkessentials.starter.mvp]
    perks: ["&7Everything in VIP+", "&f/shop premium &7- 10% off", "&f/fly &7- fly (not in combat)", "&f/nick &7- a coloured nickname", "&f12 homes", "&fRespawn kit: + shield, golden carrots", "&f1.15x /sell money"]
  mvp+:
    name: "&3&lMVP+"
    prefix: "&3&l✪ MVP+ &r"
    weight: 40
    price: 1000000
    shop: true
    icon: DIAMOND_BLOCK
    inherit: mvp
    permissions: [darkperks.repair, darkperks.glow, darkchat.color, darkhomes.homes.15, darkshop.discount.mvpplus, darkshop.multiplier.mvpplus, darkessentials.starter.mvpplus]
    perks: ["&7Everything in MVP", "&f/shop premium &7- 12.5% off", "&f/repair &7- fix the item you hold", "&f/glow &7- glow for everyone", "&fColours in chat with & codes", "&f15 homes", "&fRespawn kit: diamond sword and pieces", "&f1.2x /sell money"]
  legend:
    name: "&6&lLEGEND"
    prefix: "&6&l★ LEGEND &r"
    weight: 50
    price: 2500000
    shop: true
    icon: NETHER_STAR
    inherit: mvp+
    permissions: [darkperks.heal, darkperks.trail, darkah.unlimited, darkrtp.bypass, darkshop.discount.legend, darkshop.multiplier.legend, darkhomes.homes.20, darkessentials.starter.legend]
    perks: ["&7Everything in MVP+", "&f/shop premium &7- 15% off", "&f/heal &7- full health", "&f/trail &7- particle trails", "&fSell unlimited items on /ah", "&fNo /rtp cooldown", "&f20 homes", "&fRespawn kit: full diamond", "&f1.25x /sell money"]

  # ---- staff ranks: only given with /rank add <player> <rank>
  media:
    name: "&d&lMEDIA"
    prefix: "&d&l▶ MEDIA &r"
    weight: 60
    shop: false
    icon: RED_DYE
    inherit: legend
    permissions: []
    perks: ["&7For content creators"]
  mod:
    name: "&9&lMOD"
    prefix: "&9&l⚔ MOD &r"
    weight: 70
    shop: false
    icon: IRON_SWORD
    inherit: legend
    permissions: [darkchat.admin, darkchat.bypass, darktpa.admin]
    perks: ["&7Moderator"]
  admin:
    name: "&c&lADMIN"
    prefix: "&c&l⚡ ADMIN &r"
    weight: 80
    shop: false
    icon: GOLDEN_SWORD
    inherit: mod
    permissions: [darkperks.*]
    perks: ["&7Administrator"]
  owner:
    name: "&4&lOWNER"
    prefix: "&4&l♛ OWNER &r"
    weight: 90
    shop: false
    icon: NETHERITE_SWORD
    inherit: admin
    permissions: []
    perks: ["&7Owner"]
