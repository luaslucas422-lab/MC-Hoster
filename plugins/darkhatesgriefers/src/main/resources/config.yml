# Dark Hates Griefers by DarkerDawnFR: protected areas.
# Make one: /dhg set 1 and /dhg set 2 (looking at the two corner blocks) or /dhg wand, then /dhg create <name>.
# "/dark hates griefers set 1" works too.
# Inside, nobody can break or place blocks (broken blocks stay where they are), and there are no explosions, fire,
# pistons, lava or water flowing in, or endermen taking blocks. Let someone build: /dhg allow <player> [area].

# Can't open chests, barrels, furnaces... in protected areas either (doors, buttons and levers still work).
protect-containers: true
# Little green sparkles where someone tried to break a block.
remake-effect: true
deny-message: "&cThis area is protected. &7No breaking or placing here."
prefix: "&8[&cHates Griefers&8] "
