# Dark Performance by DarkerDawnFR: keeps a server on your PC running smoothly.

clear-items:
  # Remove items lying on the ground every this many minutes (0 = never). Warnings first.
  every-minutes: 10
  warn-at: [60, 30, 10, 5]
  # Items someone renamed are never cleared.
  keep-named: true
  # Also arrows stuck in blocks.
  arrows: true
  skip-worlds: []
  always-announce: false
  warning: "&7Items on the ground are cleared in &c{time}s&7."
  done: "&7Cleared &f{count} &7items from the ground."

# Most mobs of each kind in one chunk (from spawning, spawners and breeding). -1 = no limit.
mob-limits:
  enabled: true
  animals: 30
  monsters: 40
  villagers: 25
  water: 20

# When the server lags, lower the view distance a little; raise it again when it's smooth (Paper, Purpur, Pufferfish).
auto-view-distance:
  enabled: true
  lag-below: 17
  min: 6

prefix: "&8[&aPerformance&8] "
