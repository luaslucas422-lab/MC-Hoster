# Dark Tips by DarkerDawnFR. Change everything in game with /tips (ops).

enabled: true
interval-minutes: 5
random-order: false
sound: true
prefix: "&b&lTIP &8» &7"
tips:
  - "Use &f/home &7to set and visit your homes."
  - "Sell your farm loot with &f/sell &7and buy gear in &f/shop&7."
  - "Earn shards by playing and killing players, then spend them in &f/shards&7."
