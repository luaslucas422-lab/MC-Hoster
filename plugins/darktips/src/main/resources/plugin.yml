name: DarkTips
version: ${project.version}
main: dev.darkerdawnfr.darktips.DarkTips
api-version: "1.20"
softdepend: [DarkSettings]
author: DarkerDawnFR
description: A tip in chat every few minutes and a login announcement, all changed with /tips. Made for MC Hoster.
commands:
  tips:
    description: Ops - /tips add, list, set, remove, interval, login... Players - a random tip.
    aliases: [tip]
permissions:
  darktips.admin:
    default: op
