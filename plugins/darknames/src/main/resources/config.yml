# Dark Names by DarkerDawnFR: rename the item you hold in any colour.
# /dn (or /darknames, /dm, /dark names): Rename opens the colour menu, Reset gives the item its own name back.
# /dn rename <name> with colour codes renames right away: &a codes, &#FF8800, <#FF8800>,
# <gradient:#FF0000:#0000FF>name</gradient>.
#
# Only some ranks for gradients or animations? Give them the permission and take it from everyone else:
# darknames.gradients, darknames.animated, darknames.codes (in Dark Ranks: "-darknames.animated" on member).

# Longest name (letters, not counting colours).
max-length: 32
# How often animated names move, in ticks (20 = 1 second). Lower = smoother, more work for the server.
animation-ticks: 3
# Animated items updated per player each time (the rest wait their turn).
max-animated-per-player: 12
prefix: "&8[&dNames&8] "
