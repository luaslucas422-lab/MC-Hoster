name: DarkEssentials
version: ${project.version}
main: dev.darkerdawnfr.darkessentials.DarkEssentials
api-version: "1.20"
author: DarkerDawnFR
description: /spawn, /back, kits, join messages, AFK, /rules. Made for MC Hoster.
softdepend: [DarkCombat]
loadbefore: [DarkHub]
commands:
  spawn:
    description: Go to spawn.
  setspawn:
    description: Set spawn where you stand (ops).
    permission: darkessentials.admin
  back:
    description: Go back to where you died or last teleported from.
  kit:
    description: Claim a kit (/kit or /kits for the menu).
    aliases: [kits]
  afk:
    description: Go AFK or come back.
  rules:
    description: The server rules.
  darkessentials:
    description: Dark Essentials admin (reload, test).
    permission: darkessentials.admin
permissions:
  darkessentials.admin:
    default: op
  darkessentials.afk.bypass:
    description: Never kicked for being AFK.
    default: op
