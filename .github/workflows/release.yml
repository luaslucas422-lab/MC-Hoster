# Makes the GitHub release with dist/MC-Hoster.exe attached.
# Either push a tag like v1.0.0, or open Actions > Release > Run workflow and type the version.
# Notes come from .github/release-notes/<tag>.md if it exists.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release
        default: v1.7.1
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "MC Hoster $TAG" > /tmp/n.md; notes=/tmp/n.md; }
          gh release create "$TAG" dist/MC-Hoster.exe --title "MC Hoster ${TAG#v}" --notes-file "$notes" --latest --target "$GITHUB_SHA"
