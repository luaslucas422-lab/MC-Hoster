name: Build MC Hoster
on:
  push:
    paths-ignore: ['dist/**', 'screenshots/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
jobs:
  plugins:
    # Dark Shop, Dark AH and Dark Discord (plugins/), bundled into MC Hoster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the Dark plugins
        working-directory: plugins
        run: |
          mvn -B -q package
          mkdir -p ../darkplugins
          cp darkshop/target/DarkShop.jar darkah/target/DarkAH.jar darkdiscord/target/DarkDiscord.jar darkrtp/target/DarkRTP.jar darkscoreboard/target/DarkScoreboard.jar darkhomes/target/DarkHomes.jar darktpa/target/DarkTPA.jar darkhub/target/DarkHub.jar darkcombat/target/DarkCombat.jar darkshards/target/DarkShards.jar darkrifts/target/DarkRifts.jar ../darkplugins/
          mvn -B -q dependency:copy-dependencies -pl darkshop -DincludeScope=provided -DoutputDirectory=../../plugin-libs || true
          ls -la ../darkplugins
      - uses: actions/upload-artifact@v4
        with:
          name: dark-plugins
          path: darkplugins/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-libs
          path: plugin-libs/*.jar
          retention-days: 3

  exe:
    needs: plugins
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dark-plugins
          path: darkplugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow
      - name: Click through every tab (from source)
        run: python MC-Hoster.py --tour screenshots
      - name: Build MC-Hoster.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name MC-Hoster --icon assets/icon.ico
          --add-data "assets;assets" --add-data "gh0stac;gh0stac" --add-data "darkplugins;darkplugins" MC-Hoster.py
      - name: The exe opens its window
        shell: pwsh
        run: |
          $p = Start-Process dist\MC-Hoster.exe -ArgumentList '--tour','exe-shots' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe tour failed: $($p.ExitCode)" }
          Get-ChildItem exe-shots
      - uses: actions/upload-artifact@v4
        with:
          name: MC-Hoster
          path: |
            dist/MC-Hoster.exe
            screenshots/*.png

  selftest:
    # A real server per type, set up exactly like the window does it, then started and checked.
    needs: plugins
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: paper, version: latest }
          - { type: paper, version: "1.21.1" }
          - { type: paper, version: "1.20.6" }
          - { type: fabric, version: "1.21.1" }
          - { type: purpur, version: latest }
          - { type: pufferfish, version: latest }
          - { type: spigot, version: "1.21.11" }
          - { type: bedrock, version: latest }
          - { type: paper, version: "1.21.11", extra: --addons }
          - { type: fabric, version: "1.21.1", extra: --addons }
          - { type: paper, version: "1.20.6", extra: --dark }
          - { type: paper, version: latest, extra: --dark --vault }
          - { type: purpur, version: latest, extra: --dark }
          - { type: spigot, version: "1.21.11", extra: --dark --vault }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dark-plugins
          path: darkplugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: ${{ matrix.type }} ${{ matrix.version }}
        timeout-minutes: 30
        run: python -u MC-Hoster.py --selftest ${{ matrix.type }} ${{ matrix.version }} ${{ matrix.extra }}

  addons:
    # Every Plugins & Mods preset has to be downloadable for each server type.
    needs: plugins
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: paper, version: latest }
          - { type: paper, version: "1.20.6" }
          - { type: purpur, version: latest }
          - { type: spigot, version: "1.21.11" }
          - { type: fabric, version: "1.21.1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dark-plugins
          path: darkplugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python -u MC-Hoster.py --addons-test ${{ matrix.type }} ${{ matrix.version }}

  scheduler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python -u MC-Hoster.py --schedule-test

  orphans:
    # A server must never outlive MC Hoster, and leftover / port-blocking servers are found.
    needs: plugins
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dark-plugins
          path: darkplugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - timeout-minutes: 30
        run: python -u MC-Hoster.py --orphan-test

  publish:
    # Puts the exe and the screenshots in the repo once everything passed.
    needs: [exe, selftest, addons, scheduler, orphans]
    if: always() && needs.exe.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MC-Hoster
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: dark-plugins
          path: darkplugins
      - run: |
          mkdir -p dist screenshots
          cp out/dist/MC-Hoster.exe dist/
          cp out/screenshots/*.png screenshots/ 2>/dev/null || true
          rm -f screenshots/_icon.png
          echo "selftest: ${{ needs.selftest.result }}, addons: ${{ needs.addons.result }}, scheduler: ${{ needs.scheduler.result }}, orphans: ${{ needs.orphans.result }}" > dist/BUILD.txt
          echo "commit: ${{ github.sha }}" >> dist/BUILD.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist screenshots darkplugins
          git commit -m "MC-Hoster.exe from ${{ github.sha }} [skip ci]" || exit 0
          git push
